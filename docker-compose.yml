services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: production
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret}
      JWT_TTL_SECONDS: ${JWT_TTL_SECONDS:-900}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-dev-webhook-secret}
      DB_PATH: /app/backend/data/orbita.sqlite
      LOGIN_MAX_ATTEMPTS: ${LOGIN_MAX_ATTEMPTS:-3}
      LOGIN_LOCK_SECONDS: ${LOGIN_LOCK_SECONDS:-300}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "${BACKEND_PORT:-3000}:3000"
    volumes:
      - orbita-data:/app/backend/data
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  orbita-data:
